---
# WARNING: Replace placeholder values before applying to a real cluster.
# For production, use sealed-secrets, external-secrets, or Vault instead of plain secrets.
apiVersion: v1
kind: Secret
metadata:
  name: secrets
  labels:
    app.kubernetes.io/name: iac-security-auditor
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  POSTGRES_USER: "auditor"
  POSTGRES_PASSWORD: "changeme"
  REDIS_PASSWORD: ""
  SECRET_KEY: "replace-with-a-real-secret-key"
  DATABASE_URL: "postgresql+asyncpg://auditor:changeme@iac-postgres:5432/iac_auditor"
